<!-- Shared Chat Widget — include on every portal page -->
<!-- Usage: {% include "www/includes/chat-widget.html" %} -->
<div id="chatWidgetApp">
    {% raw %}
    <!-- Floating Admin Icon -->
    <div v-if="!chatOpen" @click="openChat"
         class="fixed bottom-5 right-5 z-[90] w-14 h-14 rounded-full bg-orange-500 hover:bg-orange-600 shadow-lg flex items-center justify-center cursor-pointer transition-all hover:scale-105">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span v-if="unreadCount > 0" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full min-w-[20px] h-5 flex items-center justify-center px-1">{{ unreadCount }}</span>
    </div>

    <!-- Chat Panel -->
    <div v-if="chatOpen"
         class="fixed bottom-0 right-0 sm:bottom-5 sm:right-5 z-[95] w-full sm:w-96 h-full sm:h-[600px] sm:max-h-[80vh] bg-white sm:rounded-xl shadow-2xl flex flex-col overflow-hidden">
        <!-- Header -->
        <div class="bg-orange-500 text-white px-4 py-3 flex items-center justify-between flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div>
                    <p class="font-bold text-sm">Admin Support</p>
                    <p class="text-xs text-orange-100">We typically reply quickly</p>
                </div>
            </div>
            <button @click="closeChat" class="p-1.5 rounded-lg hover:bg-white/20 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <!-- Messages -->
        <div ref="messagesContainer" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 bg-gray-50">
            <div v-if="loadingHistory" class="text-center text-gray-400 text-sm py-4">Loading messages...</div>
            <div v-if="!loadingHistory && messages.length === 0" class="text-center text-gray-400 text-sm py-8">
                <svg class="mx-auto mb-3 text-gray-300" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <p>No messages yet</p>
                <p class="text-xs mt-1">Send a message to start chatting with admin</p>
            </div>
            <div v-for="msg in messages" :key="msg.name"
                 :class="msg.is_admin ? 'flex justify-start' : 'flex justify-end'">
                <div :class="msg.is_admin
                             ? 'bg-white border border-gray-200 rounded-2xl rounded-tl-sm'
                             : 'bg-orange-500 text-white rounded-2xl rounded-tr-sm'"
                     class="max-w-[80%] px-3.5 py-2 shadow-sm">
                    <p class="text-sm whitespace-pre-wrap break-words">{{ msg.message }}</p>
                    <p :class="msg.is_admin ? 'text-gray-400' : 'text-orange-100'" class="text-[10px] mt-1 text-right">{{ formatTime(msg.message_date) }}</p>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="flex-shrink-0 border-t bg-white px-3 py-3">
            <div class="flex items-end gap-2">
                <textarea v-model="newMessage"
                          @keydown.enter.exact.prevent="sendMessage"
                          rows="1"
                          placeholder="Type a message..."
                          class="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm resize-none focus:outline-none focus:border-orange-400 max-h-24"></textarea>
                <button @click="sendMessage"
                        :disabled="sending || !newMessage.trim()"
                        :class="sending || !newMessage.trim() ? 'bg-gray-300 cursor-not-allowed' : 'bg-orange-500 hover:bg-orange-600'"
                        class="w-10 h-10 rounded-full flex items-center justify-center text-white transition flex-shrink-0">
                    <svg v-if="!sending" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    <svg v-else class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                </button>
            </div>
            <p v-if="sendError" class="text-xs text-red-500 mt-1">{{ sendError }}</p>
        </div>
    </div>
    {% endraw %}
</div>

<script>
(function() {
    var csrfToken = '{{ frappe.session.csrf_token }}';
    var chatWidgetEl = document.getElementById('chatWidgetApp');
    if (!chatWidgetEl) return;

    // Don't mount on admin portal pages
    if (window.location.pathname.indexOf('/admin-portal/') !== -1) return;

    var chatApp = Vue.createApp({
        setup: function() {
            var ref = Vue.ref;
            var onMounted = Vue.onMounted;

            var chatOpen = ref(false);
            var messages = ref([]);
            var loadingHistory = ref(false);
            var newMessage = ref('');
            var sending = ref(false);
            var sendError = ref('');
            var unreadCount = ref(0);
            var messagesContainer = ref(null);
            var historyLoaded = ref(false);

            function formatTime(dateStr) {
                if (!dateStr) return '';
                var d = new Date(dateStr);
                return d.toLocaleString('en-GB', {
                    day: '2-digit', month: 'short',
                    hour: '2-digit', minute: '2-digit'
                });
            }

            function scrollToBottom() {
                if (messagesContainer.value) {
                    messagesContainer.value.scrollTop = messagesContainer.value.scrollHeight;
                }
            }

            function fetchUnreadCount() {
                fetch('/api/method/smartspace.frontend_api.chat.get_unread_count')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        var result = data.message || data;
                        unreadCount.value = result.unread_count || 0;
                    })
                    .catch(function() {});
            }

            function fetchHistory() {
                loadingHistory.value = true;
                fetch('/api/method/smartspace.frontend_api.chat.get_chat_history?limit=50')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        var result = data.message || data;
                        messages.value = result.messages || [];
                        loadingHistory.value = false;
                        historyLoaded.value = true;
                        setTimeout(scrollToBottom, 100);
                    })
                    .catch(function() {
                        loadingHistory.value = false;
                    });
            }

            function openChat() {
                chatOpen.value = true;
                if (!historyLoaded.value) {
                    fetchHistory();
                }
                unreadCount.value = 0;
            }

            function closeChat() {
                chatOpen.value = false;
            }

            function sendMessage() {
                if (!newMessage.value.trim() || sending.value) return;
                sendError.value = '';
                sending.value = true;
                var body = new URLSearchParams({
                    message: newMessage.value.trim()
                });
                fetch('/api/method/smartspace.frontend_api.chat.send_message', {
                    method: 'POST',
                    headers: {
                        'X-Frappe-CSRF-Token': csrfToken,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body.toString()
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    sending.value = false;
                    var result = data.message || data;
                    if (result.success) {
                        messages.value.push({
                            name: result.chat_name,
                            message: newMessage.value.trim(),
                            message_date: result.message_date,
                            is_admin: false,
                            is_admin_reply: 0
                        });
                        newMessage.value = '';
                        setTimeout(scrollToBottom, 50);
                    } else {
                        sendError.value = result.message || 'Failed to send message';
                    }
                })
                .catch(function() {
                    sending.value = false;
                    sendError.value = 'Failed to send message. Please try again.';
                });
            }

            onMounted(function() {
                fetchUnreadCount();
                setInterval(fetchUnreadCount, 30000);
            });

            return {
                chatOpen, messages, loadingHistory, newMessage, sending,
                sendError, unreadCount, messagesContainer,
                formatTime, openChat, closeChat, sendMessage
            };
        }
    });
    chatApp.mount('#chatWidgetApp');
})();
</script>
