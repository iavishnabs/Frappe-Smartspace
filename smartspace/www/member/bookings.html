<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | SmartSpace</title>
    <link rel="manifest" href="/assets/smartspace/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/smartspace/favicon.svg">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartSpace">
    <link rel="apple-touch-icon" href="/assets/smartspace/icon-192.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{boxShadow:{card:"0 10px 30px rgba(0,0,0,.08)"}}}}</script>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">
{% set active = 'bookings' %}
{% include "www/nav_footer/portal_header.html" %}
{% include "www/member/sidebar.html" %}
<div class="sidebar-content transition-all duration-300">
    <div class="bg-black text-white px-6 py-8">
        <div class="flex items-center justify-between flex-wrap gap-4">
            <div>
                <h1 class="text-3xl font-bold">My Bookings</h1>
                <p class="text-orange-200 text-sm mt-1">View and track all your reservations</p>
            </div>
            <a href="/spaces" class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-3 rounded-xl font-semibold transition text-sm">Book a Space</a>
        </div>
    </div>
    <div class="px-6 py-6">
        <div class="flex flex-wrap gap-3 mb-6">
            <select id="statusFilter" class="border rounded-xl px-4 py-3">
                <option value="All Status">All Status</option>
                <option value="Pending">Pending</option>
                <option value="Booked">Booked</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>
        <div id="loadingState" class="text-center py-12 text-gray-400">
            <svg class="animate-spin mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            Loading bookings...
        </div>
        <div id="bookingsList" class="space-y-3" style="display:none"></div>
        <div id="noBookings" class="hidden text-center py-20">
            <div class="text-7xl">📅</div>
            <h2 class="text-2xl font-bold mt-4">No Bookings Found</h2>
            <a href="/member/spaces" class="inline-block mt-4 bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-xl font-semibold transition">Book a Space</a>
        </div>
        <div id="pagination" class="flex items-center justify-center gap-4 mt-10" style="display:none">
            <button id="btnPrev" class="bg-white border rounded-lg px-5 py-2 text-sm font-semibold hover:bg-gray-50 disabled:opacity-0 disabled:pointer-events-none transition">← Prev</button>
            <span id="pageInfo" class="text-sm text-gray-600"></span>
            <button id="btnNext" class="bg-white border rounded-lg px-5 py-2 text-sm font-semibold hover:bg-gray-50 disabled:opacity-0 disabled:pointer-events-none transition">Next →</button>
        </div>
    </div>
</div>
<script>
var currentPage = 1;
var totalPages = 1;

function fmtCurrency(v) { return '₹' + (v || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
function fmtDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
function statusColor(s) { var m = { 'Pending': '#f59e0b', 'Booked': '#3b82f6', 'Paid': '#22c55e', 'Completed': '#6b7280', 'Cancelled': '#ef4444' }; return m[s] || '#6b7280'; }

function fetchBookings(page) {
    currentPage = page || 1;
    var status = document.getElementById('statusFilter').value;
    document.getElementById('loadingState').style.display = '';
    document.getElementById('bookingsList').style.display = 'none';
    document.getElementById('pagination').style.display = 'none';
    document.getElementById('noBookings').classList.add('hidden');

    var params = new URLSearchParams({ page: currentPage, page_size: 10 });
    if (status && status !== 'All Status') params.set('status', status);

    fetch('/api/method/smartspace.frontend_api.member.get_my_bookings?' + params.toString())
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var result = data.message || data;
            document.getElementById('loadingState').style.display = 'none';

            if (!result.bookings || result.bookings.length === 0) {
                document.getElementById('noBookings').classList.remove('hidden');
                return;
            }

            document.getElementById('bookingsList').style.display = '';
            document.getElementById('bookingsList').innerHTML = result.bookings.map(function(b) {
                var sc = statusColor(b.booking_status);
                var psc = b.payment_status === 'Paid' ? '#22c55e' : '#f59e0b';
                return '<a href="/member/booking-detail?name=' + encodeURIComponent(b.name) + '" class="block bg-white rounded-xl shadow-card p-5 hover:shadow-lg transition">' +
                    '<div class="flex items-center justify-between flex-wrap gap-3">' +
                        '<div class="flex items-center gap-4">' +
                            '<div class="w-12 h-12 rounded-xl bg-orange-100 flex items-center justify-center text-2xl shrink-0">' + (b.space_type === 'Desk' ? '💻' : b.space_type === 'Cabin' ? '🛖' : b.space_type === 'Conference Room' ? '🏢' : b.space_type === 'Event Hall' ? '🎪' : '🏢') + '</div>' +
                            '<div><p class="font-bold">' + (b.space || 'N/A') + '</p>' +
                            '<p class="text-xs text-gray-500 mt-0.5">' + fmtDate(b.booking_from) + ' • ' + (b.booking_type || '') + ' • ' + (b.count || 1) + 'x</p></div>' +
                        '</div>' +
                        '<div class="text-right">' +
                            '<span class="text-xs font-medium px-2 py-0.5 rounded" style="background:' + sc + '20;color:' + sc + '">' + b.booking_status + '</span>' +
                            '<span class="text-xs font-medium px-2 py-0.5 rounded ml-1" style="background:' + psc + '20;color:' + psc + '">' + b.payment_status + '</span>' +
                            '<p class="text-sm font-bold text-orange-500 mt-1">' + fmtCurrency(b.total_amount) + '</p>' +
                        '</div>' +
                    '</div>' +
                '</a>';
            }).join('');

            totalPages = result.total_pages || 1;
            if (totalPages > 1) {
                document.getElementById('pagination').style.display = '';
                document.getElementById('pageInfo').textContent = 'Page ' + currentPage + ' of ' + totalPages;
                document.getElementById('btnPrev').classList.toggle('opacity-0', currentPage <= 1);
                document.getElementById('btnNext').classList.toggle('opacity-0', currentPage >= totalPages);
            }
        });
}

document.getElementById('statusFilter').addEventListener('change', function() { fetchBookings(1); });
document.getElementById('btnPrev').addEventListener('click', function() { if (currentPage > 1) { fetchBookings(currentPage - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
document.getElementById('btnNext').addEventListener('click', function() { if (currentPage < totalPages) { fetchBookings(currentPage + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); } });

fetchBookings(1);
</script>
</body>
</html>
