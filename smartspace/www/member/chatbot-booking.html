<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Booking Assistant | SmartSpace</title>
    <link rel="manifest" href="/assets/smartspace/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/smartspace/favicon.svg">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartSpace">
    <link rel="apple-touch-icon" href="/assets/smartspace/icon-192.svg">
    <script src="/assets/smartspace/js/tailwind.js"></script>
    <script>tailwind.config={theme:{extend:{boxShadow:{card:"0 10px 30px rgba(0,0,0,.08)"}}}}</script>
    <script src="/assets/smartspace/js/vue.global.js"></script>
    <style>[v-cloak]{display:none}</style>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">
{% set active = 'chatbot' %}
{% include "www/nav_footer/portal_header.html" %}
{% include "www/member/sidebar.html" %}
<div class="sidebar-content transition-all duration-300">
    <div class="bg-black text-white px-6 py-8">
        <h1 class="text-3xl font-bold">AI Booking Assistant</h1>
        <p class="text-orange-200 text-sm mt-1">Book Conference Rooms and Event Halls via chat</p>
    </div>
    <div class="px-6 py-6 max-w-3xl">
        <div id="chatbot-app" v-cloak class="bg-white rounded-xl shadow-card overflow-hidden flex flex-col" style="height:600px">
            <!-- Header -->
            <div class="bg-gradient-to-r from-orange-500 to-orange-600 text-white px-5 py-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
                </div>
                <div>
                    <p class="font-bold">SmartSpace Assistant</p>
                    <p class="text-xs text-orange-100">Online • Conference & Event Hall Booking</p>
                </div>
            </div>

            <!-- Messages -->
            <div ref="messagesContainer" class="flex-1 overflow-y-auto p-5 space-y-4 bg-gray-50">
                <template v-for="(msg, i) in messages" :key="i">
                    <!-- Bot message with space cards -->
                    <div v-if="msg.type === 'space-cards'" class="flex gap-2 max-w-[90%]">
                        <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center shrink-0 text-white text-xs font-bold">AI</div>
                        <div class="space-y-2">
                            <div class="rounded-2xl px-4 py-3 text-sm bg-white border border-gray-200 shadow-sm">Here are the available spaces. Tap one to select:</div>
                            <div class="flex gap-3 overflow-x-auto pb-2">
                                <div v-for="s in msg.spaces" :key="s.name"
                                    @click="selectSpace(s)"
                                    class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm cursor-pointer hover:border-orange-400 transition min-w-[240px]">
                                    <div class="flex items-center gap-3 mb-2">
                                        <div class="w-10 h-10 rounded-lg bg-orange-100 flex items-center justify-center text-xl">[[ s.space_type === 'Conference Room' ? '🏢' : '🎪' ]]</div>
                                        <div><p class="font-bold text-sm">[[ s.name ]]</p><p class="text-xs text-gray-500">[[ s.space_type ]]</p></div>
                                    </div>
                                    <div class="text-xs text-gray-500 space-y-0.5">
                                        <p>📍 [[ s.location_name || s.location || 'N/A' ]]</p>
                                        <p>👥 [[ s.seating_capacity || 0 ]] seats</p>
                                        <p>💰 [[ fmtCurrency(s.hourly_rate) ]]/hr</p>
                                    </div>
                                    <button class="w-full mt-3 bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg font-medium text-xs transition">Select</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bot summary card -->
                    <div v-else-if="msg.type === 'summary'" class="flex gap-2 max-w-[80%]">
                        <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center shrink-0 text-white text-xs font-bold">AI</div>
                        <div class="rounded-2xl px-4 py-3 text-sm bg-white border border-gray-200 shadow-sm">
                            <p class="font-bold mb-2">Booking Summary</p>
                            <div class="space-y-1 text-xs">
                                <p>🏢 Space: <strong>[[ msg.data.space ]]</strong></p>
                                <p>📋 Type: <strong>[[ msg.data.booking_type ]]</strong></p>
                                <p>🔢 Count: <strong>[[ msg.data.count ]]</strong></p>
                                <p>📅 Start: <strong>[[ msg.data.booking_from ]]</strong></p>
                                <p v-if="msg.data.purpose">📝 Purpose: [[ msg.data.purpose ]]</p>
                                <p v-if="msg.data.attendees">👥 Attendees: [[ msg.data.attendees ]]</p>
                                <p class="pt-1">💰 Total: <strong class="text-orange-600">[[ fmtCurrency(msg.data.total) ]]</strong></p>
                            </div>
                            <p class="mt-3 text-sm">Confirm this booking?</p>
                        </div>
                    </div>

                    <!-- Bot success card -->
                    <div v-else-if="msg.type === 'success'" class="flex gap-2 max-w-[80%]">
                        <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center shrink-0 text-white text-xs font-bold">AI</div>
                        <div class="rounded-2xl px-4 py-3 text-sm bg-white border border-gray-200 shadow-sm">
                            <p class="font-bold text-green-600 mb-1">✅ Booking created successfully!</p>
                            <p>Reservation: <strong>[[ msg.reservation ]]</strong></p>
                            <p>Status: [[ msg.booking_status ]]</p>
                            <p>Total: [[ fmtCurrency(msg.total_amount) ]]</p>
                            <a :href="'/member/booking-detail?name=' + encodeURIComponent(msg.reservation)" class="inline-block mt-2 text-orange-600 font-medium underline">View Booking Details →</a>
                        </div>
                    </div>

                    <!-- Regular bot message -->
                    <div v-else-if="msg.sender === 'bot'" class="flex gap-2 max-w-[80%]">
                        <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center shrink-0 text-white text-xs font-bold">AI</div>
                        <div class="rounded-2xl px-4 py-3 text-sm bg-white border border-gray-200 shadow-sm" v-html="msg.text"></div>
                    </div>

                    <!-- User message -->
                    <div v-else class="flex gap-2 max-w-[80%] ml-auto flex-row-reverse">
                        <div class="w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center shrink-0 text-gray-600 text-xs font-bold">You</div>
                        <div class="rounded-2xl px-4 py-3 text-sm bg-orange-500 text-white shadow-sm">[[ msg.text ]]</div>
                    </div>
                </template>

                <!-- Typing indicator -->
                <div v-if="typing" class="flex gap-2 max-w-[80%]">
                    <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center shrink-0 text-white text-xs font-bold">AI</div>
                    <div class="rounded-2xl px-4 py-3 text-sm bg-white border border-gray-200 shadow-sm">
                        <span class="inline-flex gap-1">
                            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay:0s"></span>
                            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay:0.15s"></span>
                            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay:0.3s"></span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="border-t p-4 bg-white">
                <div v-if="quickReplies.length" class="flex flex-wrap gap-2 mb-3">
                    <button v-for="qr in quickReplies" :key="qr.value"
                        @click="handleQuickReply(qr.value)"
                        class="bg-orange-50 hover:bg-orange-100 text-orange-700 px-3 py-1.5 rounded-full text-xs font-medium transition">
                        [[ qr.label ]]
                    </button>
                </div>
                <div class="flex gap-2">
                    <input v-model="inputText"
                        type="text"
                        placeholder="Type your message..."
                        class="flex-1 border rounded-xl px-4 py-3 text-sm"
                        @keyup.enter="handleUserInput">
                    <button @click="handleUserInput" class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-3 rounded-xl font-medium text-sm transition">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
var csrfToken = '{{ frappe.session.csrf_token }}';

const { createApp, ref, reactive, nextTick, onMounted } = Vue;

createApp({
    delimiters: ['[[', ']]'],
    setup() {
        const messages = ref([]);
        const inputText = ref('');
        const quickReplies = ref([]);
        const typing = ref(false);
        const messagesContainer = ref(null);

        const chatbotSpaces = ref([]);
        const selectedSpace = ref(null);
        const bookingData = reactive({
            space: null, booking_type: null, booking_from: null,
            count: null, purpose: null, attendees: null
        });
        let conversationState = 'greeting';

        function fmtCurrency(v) {
            return '\u20B9' + (v || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
        }

        function scrollToBottom() {
            nextTick(function() {
                if (messagesContainer.value) {
                    messagesContainer.value.scrollTop = messagesContainer.value.scrollHeight;
                }
            });
        }

        function addBotMessage(text) {
            messages.value.push({ sender: 'bot', text: text });
            scrollToBottom();
        }

        function addUserMessage(text) {
            messages.value.push({ sender: 'user', text: text });
            scrollToBottom();
        }

        function addSpaceCards(spaces) {
            messages.value.push({ type: 'space-cards', spaces: spaces });
            scrollToBottom();
        }

        function addSummaryCard(data) {
            messages.value.push({ type: 'summary', data: data });
            scrollToBottom();
        }

        function addSuccessCard(result) {
            messages.value.push({
                type: 'success',
                reservation: result.reservation,
                booking_status: result.booking_status,
                total_amount: result.total_amount
            });
            scrollToBottom();
        }

        function showQuickReplies(replies) {
            quickReplies.value = replies;
        }

        function clearQuickReplies() {
            quickReplies.value = [];
        }

        function handleQuickReply(value) {
            inputText.value = value;
            handleUserInput();
        }

        async function fetchSpaces(spaceType) {
            typing.value = true;
            scrollToBottom();
            try {
                var params = new URLSearchParams();
                if (spaceType) params.set('space_type', spaceType);
                var resp = await fetch('/api/method/smartspace.frontend_api.member.get_chatbot_spaces?' + params.toString());
                var data = await resp.json();
                var result = data.message || data;
                typing.value = false;

                chatbotSpaces.value = result.spaces || [];
                if (chatbotSpaces.value.length === 0) {
                    addBotMessage('Sorry, no ' + (spaceType || 'Conference Room or Event Hall') + ' spaces are currently available.');
                    showQuickReplies([{ label: 'Start Over', value: 'start' }]);
                    return;
                }
                addBotMessage('Here are the available ' + (spaceType || 'Conference Room & Event Hall') + ' spaces:');
                addSpaceCards(chatbotSpaces.value);
                conversationState = 'select_space';
            } catch(e) {
                typing.value = false;
                addBotMessage('Error fetching spaces. Please try again.');
            }
        }

        function selectSpace(s) {
            selectedSpace.value = s;
            bookingData.space = s.name;
            addUserMessage('I\'d like to book ' + s.name);
            addBotMessage('Great choice! <strong>' + s.name + '</strong> — ' + s.space_type + ' with ' + (s.seating_capacity || 0) + ' seats at ' + fmtCurrency(s.hourly_rate) + '/hr.<br><br>What booking type do you prefer?');
            showQuickReplies([
                { label: 'Hourly', value: 'Hourly' },
                { label: 'Daily', value: 'Daily' },
                { label: 'Weekly', value: 'Weekly' },
                { label: 'Monthly', value: 'Monthly' },
            ]);
            conversationState = 'booking_type';
        }

        function handleUserInput() {
            var text = inputText.value.trim();
            if (!text) return;
            inputText.value = '';
            clearQuickReplies();

            if (conversationState === 'done' && /start|new|again|book/i.test(text)) {
                resetConversation();
                startConversation();
                return;
            }

            if (conversationState === 'done' && /dashboard/i.test(text)) {
                window.location.href = '/member/dashboard';
                return;
            }

            if (text.toLowerCase() === 'change time') {
                addUserMessage('I want to change the time');
                addBotMessage('Sure! When would you like to start? (e.g. 2025-01-15 14:00)');
                conversationState = 'booking_from';
                return;
            }

            if (conversationState === 'greeting') {
                addUserMessage(text);
                if (/conference|event|hall|room/i.test(text)) {
                    fetchSpaces(text.toLowerCase().includes('conference') ? 'Conference Room' : text.toLowerCase().includes('event') ? 'Event Hall' : null);
                } else {
                    addBotMessage('I can help you book <strong>Conference Rooms</strong> and <strong>Event Halls</strong>. Which would you like?');
                    showQuickReplies([
                        { label: 'Conference Room', value: 'Conference Room' },
                        { label: 'Event Hall', value: 'Event Hall' },
                    ]);
                }
            } else if (conversationState === 'booking_type') {
                addUserMessage(text);
                var validTypes = ['Hourly', 'Daily', 'Weekly', 'Monthly', 'Yearly'];
                var match = validTypes.find(function(t) { return t.toLowerCase() === text.toLowerCase(); });
                if (match) {
                    bookingData.booking_type = match;
                    addBotMessage('Booking type: <strong>' + match + '</strong>. How many ' + match.toLowerCase() + 's do you need?');
                    showQuickReplies([
                        { label: '1', value: '1' },
                        { label: '2', value: '2' },
                        { label: '4', value: '4' },
                        { label: '8', value: '8' },
                    ]);
                    conversationState = 'count';
                } else {
                    addBotMessage('Please choose a valid booking type.');
                    showQuickReplies([
                        { label: 'Hourly', value: 'Hourly' },
                        { label: 'Daily', value: 'Daily' },
                        { label: 'Weekly', value: 'Weekly' },
                        { label: 'Monthly', value: 'Monthly' },
                    ]);
                }
            } else if (conversationState === 'count') {
                addUserMessage(text);
                var count = parseInt(text);
                if (count > 0) {
                    bookingData.count = count;
                    addBotMessage('Got it, <strong>' + count + '</strong> ' + bookingData.booking_type.toLowerCase() + '(s). When would you like to start? (e.g. 2025-01-15 14:00)');
                    conversationState = 'booking_from';
                } else {
                    addBotMessage('Please enter a valid number.');
                }
            } else if (conversationState === 'booking_from') {
                addUserMessage(text);
                var dt = text.replace('T', ' ');
                bookingData.booking_from = dt;
                addBotMessage('Start time noted: <strong>' + dt + '</strong>. What is the purpose of your booking? (Optional - type "skip" to skip)');
                conversationState = 'purpose';
            } else if (conversationState === 'purpose') {
                addUserMessage(text);
                if (text.toLowerCase() !== 'skip') bookingData.purpose = text;
                addBotMessage('How many attendees are expected? (Optional - type "skip" to skip)');
                conversationState = 'attendees';
            } else if (conversationState === 'attendees') {
                addUserMessage(text);
                if (text.toLowerCase() !== 'skip') bookingData.attendees = text;
                showBookingSummary();
            } else if (conversationState === 'confirm') {
                addUserMessage(text);
                if (/yes|confirm|ok|sure|go ahead/i.test(text)) {
                    submitChatbotBooking();
                } else {
                    addBotMessage('Booking cancelled. Type "start" to begin a new booking.');
                    resetConversation();
                }
            }
        }

        async function showBookingSummary() {
            typing.value = true;
            scrollToBottom();

            // Check availability first
            var params = new URLSearchParams({
                space: bookingData.space,
                booking_from: bookingData.booking_from,
                booking_type: bookingData.booking_type,
                count: bookingData.count,
            });

            try {
                var resp = await fetch('/api/method/smartspace.frontend_api.member.check_space_availability?' + params.toString());
                var data = await resp.json();
                var result = data.message || data;
                typing.value = false;

                if (!result.available) {
                    addBotMessage('<strong>⚠️ Booking Conflict Detected</strong><br><br>' +
                        'This space is not available for the requested time.<br><br>' +
                        '<strong>Conflicting bookings:</strong><br>' +
                        result.conflicts.map(function(c) { return '• ' + c; }).join('<br>') +
                        '<br><br>Please choose a different time or space.');
                    showQuickReplies([
                        { label: 'Choose Different Time', value: 'change time' },
                        { label: 'Choose Different Space', value: 'start' },
                    ]);
                    conversationState = 'booking_from';
                    return;
                }
            } catch(e) {
                typing.value = false;
                addBotMessage('Could not verify availability. Proceeding with booking summary...');
            }

            var rate = selectedSpace.value ? selectedSpace.value.hourly_rate : 0;
            var multiplier = { hourly: 1, daily: 8, weekly: 40, monthly: 160, yearly: 1920 };
            var mult = multiplier[(bookingData.booking_type || '').toLowerCase()] || 1;
            var total = rate * mult * (bookingData.count || 1);

            var summaryData = {
                space: bookingData.space,
                booking_type: bookingData.booking_type,
                count: bookingData.count,
                booking_from: bookingData.booking_from,
                purpose: bookingData.purpose,
                attendees: bookingData.attendees,
                total: total
            };

            addBotMessage('✅ <strong>Space is available!</strong> No conflicting bookings found.');
            addSummaryCard(summaryData);
            showQuickReplies([
                { label: 'Yes, Confirm', value: 'Yes' },
                { label: 'Cancel', value: 'Cancel' },
            ]);
            conversationState = 'confirm';
        }

        async function submitChatbotBooking() {
            typing.value = true;
            scrollToBottom();

            var body = new URLSearchParams({
                space: bookingData.space,
                booking_type: bookingData.booking_type,
                booking_from: bookingData.booking_from,
                count: bookingData.count,
            });
            if (bookingData.purpose) body.set('purpose', bookingData.purpose);
            if (bookingData.attendees) body.set('attendees', bookingData.attendees);

            try {
                var resp = await fetch('/api/method/smartspace.frontend_api.member.chatbot_create_booking', {
                    method: 'POST',
                    headers: { 'X-Frappe-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString()
                });
                var data = await resp.json();
                typing.value = false;
                var result = data.message || data;
                if (result.success) {
                    addSuccessCard(result);
                    showQuickReplies([
                        { label: 'Book Another', value: 'start' },
                        { label: 'Go to Dashboard', value: 'dashboard' },
                    ]);
                    conversationState = 'done';
                } else {
                    throw new Error(result.message || 'Failed to create booking');
                }
            } catch(err) {
                typing.value = false;
                addBotMessage('Failed to create booking: ' + (err.message || 'Unknown error') + '. Please try again.');
                showQuickReplies([{ label: 'Start Over', value: 'start' }]);
                conversationState = 'done';
            }
        }

        function resetConversation() {
            selectedSpace.value = null;
            bookingData.space = null;
            bookingData.booking_type = null;
            bookingData.booking_from = null;
            bookingData.count = null;
            bookingData.purpose = null;
            bookingData.attendees = null;
            conversationState = 'greeting';
        }

        function startConversation() {
            messages.value = [];
            resetConversation();
            addBotMessage('Hi! I\'m your <strong>SmartSpace AI Assistant</strong> \uD83E\uDD16<br><br>I can help you book <strong>Conference Rooms</strong> and <strong>Event Halls</strong>. These spaces are only available through this assistant.<br><br>What would you like to book?');
            showQuickReplies([
                { label: 'Conference Room', value: 'Conference Room' },
                { label: 'Event Hall', value: 'Event Hall' },
            ]);
        }

        onMounted(function() {
            startConversation();
        });

        return {
            messages, inputText, quickReplies, typing, messagesContainer,
            fmtCurrency, handleUserInput, handleQuickReply, selectSpace
        };
    }
}).mount('#chatbot-app');
</script>
</body>
</html>
