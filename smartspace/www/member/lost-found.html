<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found | SmartSpace</title>
    <link rel="manifest" href="/assets/smartspace/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/smartspace/favicon.svg">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartSpace">
    <link rel="apple-touch-icon" href="/assets/smartspace/icon-192.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{boxShadow:{card:"0 10px 30px rgba(0,0,0,.08)"}}}}</script>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">
{% set active = 'lost-found' %}
{% include "www/nav_footer/portal_header.html" %}
{% include "www/member/sidebar.html" %}
<div class="sidebar-content transition-all duration-300">
    <div class="bg-black text-white px-6 py-8">
        <div class="flex items-center justify-between flex-wrap gap-3">
            <div>
                <h1 class="text-3xl font-bold">Lost & Found</h1>
                <p class="text-orange-200 text-sm mt-1">Report lost or found items</p>
            </div>
            <button onclick="openLFModal()" class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition">+ New Report</button>
        </div>
    </div>
    <div class="px-6 py-6">
        <div class="flex flex-wrap gap-3 mb-6">
            <input id="searchInput" type="text" placeholder="Search items..." class="border rounded-xl px-4 py-3 flex-1 min-w-[200px]">
            <select id="statusFilter" class="border rounded-xl px-4 py-3">
                <option value="All Status">All Status</option>
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
            </select>
        </div>
        <div id="loadingState" class="text-center py-12 text-gray-400">
            <svg class="animate-spin mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            Loading...
        </div>
        <div id="lfList" class="space-y-3" style="display:none"></div>
        <div id="noLF" class="hidden text-center py-20">
            <div class="text-7xl">🔍</div>
            <h2 class="text-2xl font-bold mt-4">No Reports Found</h2>
        </div>
        <div id="pagination" class="flex items-center justify-center gap-4 mt-10" style="display:none">
            <button id="btnPrev" class="bg-white border rounded-lg px-5 py-2 text-sm font-semibold hover:bg-gray-50 disabled:opacity-0 disabled:pointer-events-none transition">← Prev</button>
            <span id="pageInfo" class="text-sm text-gray-600"></span>
            <button id="btnNext" class="bg-white border rounded-lg px-5 py-2 text-sm font-semibold hover:bg-gray-50 disabled:opacity-0 disabled:pointer-events-none transition">Next →</button>
        </div>
    </div>
</div>

<div id="lfModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50" onclick="closeLFModal()"></div>
    <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
        <h3 class="text-xl font-bold mb-4" id="lfModalTitle">New Report</h3>
        <input type="hidden" id="editLFName">
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Report Type</label>
                <select id="lfReportType" class="w-full border rounded-xl px-4 py-3">
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Item Name</label>
                <input type="text" id="lfItemName" placeholder="e.g. Black Wallet" class="w-full border rounded-xl px-4 py-3">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <textarea id="lfDesc" rows="3" placeholder="Describe the item..." class="w-full border rounded-xl px-4 py-3"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Image</label>
                <input type="file" id="lfImage" accept="image/*" class="w-full border rounded-xl px-4 py-2.5 text-sm">
                <div id="lfImagePreview" class="mt-2" style="display:none">
                    <img id="lfImagePreviewImg" class="w-32 h-32 object-cover rounded-lg border">
                    <button onclick="clearLFImage()" class="text-xs text-red-500 hover:text-red-700 mt-1">Remove</button>
                </div>
                <input type="hidden" id="lfImageUrl" value="">
            </div>
        </div>
        <div id="lfError" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mt-4"></div>
        <div class="flex gap-3 mt-4">
            <button onclick="closeLFModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold transition">Cancel</button>
            <button id="saveLFBtn" onclick="saveLF()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition">Submit</button>
        </div>
    </div>
</div>

<script>
var csrfToken = '{{ frappe.session.csrf_token }}';
var currentPage = 1;
var totalPages = 1;
var lfItemsCache = [];

function fmtDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }

function fetchLF(page) {
    currentPage = page || 1;
    var search = document.getElementById('searchInput').value.trim();
    var status = document.getElementById('statusFilter').value;
    document.getElementById('loadingState').style.display = '';
    document.getElementById('lfList').style.display = 'none';
    document.getElementById('pagination').style.display = 'none';
    document.getElementById('noLF').classList.add('hidden');

    var params = new URLSearchParams({ page: currentPage, page_size: 10 });
    if (search) params.set('search', search);
    if (status && status !== 'All Status') params.set('status', status);

    fetch('/api/method/smartspace.frontend_api.member.get_lost_found?' + params.toString())
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var result = data.message || data;
            document.getElementById('loadingState').style.display = 'none';

            if (!result.items || result.items.length === 0) {
                document.getElementById('noLF').classList.remove('hidden');
                return;
            }

            document.getElementById('lfList').style.display = '';
            lfItemsCache = result.items;
            document.getElementById('lfList').innerHTML = result.items.map(function(item) {
                var typeColor = item.report_type === 'Lost' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';
                var statusColor = item.status === 'Open' ? '#f59e0b' : '#6b7280';
                var actions = '';
                if (item.status === 'Open') {
                    actions = '<button onclick="editLF(\'' + item.name + '\')" class="text-blue-500 hover:text-blue-700 text-xs font-medium">Edit</button>' +
                        '<button onclick="closeLF(\'' + item.name + '\')" class="text-gray-500 hover:text-gray-700 text-xs font-medium ml-2">Close</button>' +
                        '<button onclick="deleteLF(\'' + item.name + '\')" class="text-red-500 hover:text-red-700 text-xs font-medium ml-2">Delete</button>';
                }
                return '<div class="bg-white rounded-xl shadow-card p-5">' +
                    '<div class="flex items-center justify-between flex-wrap gap-2">' +
                        '<div class="flex items-center gap-3">' +
                            '<span class="px-2 py-0.5 rounded-full text-xs font-bold ' + typeColor + '">' + (item.report_type || '-') + '</span>' +
                            '<p class="font-bold text-sm">' + (item.item_name || '-') + '</p>' +
                        '</div>' +
                        '<span class="text-xs font-medium px-2 py-0.5 rounded" style="background:' + statusColor + '20;color:' + statusColor + '">' + item.status + '</span>' +
                    '</div>' +
                    (item.description ? '<p class="text-sm text-gray-600 mt-2">' + item.description + '</p>' : '') +
                    '<p class="text-xs text-gray-400 mt-2">' + fmtDate(item.reported_date) + '</p>' +
                    '<div class="mt-3">' + actions + '</div>' +
                '</div>';
            }).join('');

            totalPages = result.total_pages || 1;
            if (totalPages > 1) {
                document.getElementById('pagination').style.display = '';
                document.getElementById('pageInfo').textContent = 'Page ' + currentPage + ' of ' + totalPages;
                document.getElementById('btnPrev').classList.toggle('opacity-0', currentPage <= 1);
                document.getElementById('btnNext').classList.toggle('opacity-0', currentPage >= totalPages);
            }
        });
}

function openLFModal() {
    document.getElementById('lfModalTitle').textContent = 'New Report';
    document.getElementById('editLFName').value = '';
    document.getElementById('lfReportType').value = 'Lost';
    document.getElementById('lfItemName').value = '';
    document.getElementById('lfDesc').value = '';
    document.getElementById('lfImage').value = '';
    document.getElementById('lfImageUrl').value = '';
    document.getElementById('lfImagePreview').style.display = 'none';
    document.getElementById('lfError').classList.add('hidden');
    document.getElementById('saveLFBtn').textContent = 'Submit';
    document.getElementById('lfModal').classList.remove('hidden');
}

function editLF(name) {
    var item = lfItemsCache.find(function(i) { return i.name === name; });
    if (!item) return;
    document.getElementById('lfModalTitle').textContent = 'Edit Report';
    document.getElementById('editLFName').value = name;
    document.getElementById('lfReportType').value = item.report_type || 'Lost';
    document.getElementById('lfItemName').value = item.item_name || '';
    document.getElementById('lfDesc').value = item.description || '';
    var imgUrl = item.image || '';
    document.getElementById('lfImageUrl').value = imgUrl;
    document.getElementById('lfImage').value = '';
    if (imgUrl) {
        document.getElementById('lfImagePreviewImg').src = imgUrl;
        document.getElementById('lfImagePreview').style.display = '';
    } else {
        document.getElementById('lfImagePreview').style.display = 'none';
    }
    document.getElementById('lfError').classList.add('hidden');
    document.getElementById('saveLFBtn').textContent = 'Update';
    document.getElementById('lfModal').classList.remove('hidden');
}

function closeLFModal() {
    document.getElementById('lfModal').classList.add('hidden');
}

function clearLFImage() {
    document.getElementById('lfImageUrl').value = '';
    document.getElementById('lfImage').value = '';
    document.getElementById('lfImagePreview').style.display = 'none';
}

document.addEventListener('change', function(e) {
    if (e.target && e.target.id === 'lfImage') {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            document.getElementById('lfImagePreviewImg').src = ev.target.result;
            document.getElementById('lfImagePreview').style.display = '';
        };
        reader.readAsDataURL(file);
    }
});

function saveLF() {
    var name = document.getElementById('editLFName').value;
    var type = document.getElementById('lfReportType').value;
    var itemName = document.getElementById('lfItemName').value.trim();
    var desc = document.getElementById('lfDesc').value.trim();
    var imageUrl = document.getElementById('lfImageUrl').value;
    var errDiv = document.getElementById('lfError');
    errDiv.classList.add('hidden');

    if (!itemName) { errDiv.textContent = 'Please enter item name'; errDiv.classList.remove('hidden'); return; }

    var btn = document.getElementById('saveLFBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    var fileInput = document.getElementById('lfImage');
    var file = fileInput.files[0];

    if (file) {
        var formData = new FormData();
        formData.append('file', file);
        formData.append('is_private', '0');
        fetch('/api/method/upload_file', {
            method: 'POST',
            headers: { 'X-Frappe-CSRF-Token': csrfToken },
            body: formData
        })
        .then(function(r) { return r.json(); })
        .then(function(uploadRes) {
            var uploaded = uploadRes.message || uploadRes;
            imageUrl = (uploaded && uploaded.file_url) ? uploaded.file_url : '';
            doSaveLF(name, type, itemName, desc, imageUrl, btn, errDiv);
        })
        .catch(function() {
            errDiv.textContent = 'Failed to upload image. Please try again.';
            errDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = name ? 'Update' : 'Submit';
        });
    } else {
        doSaveLF(name, type, itemName, desc, imageUrl, btn, errDiv);
    }
}

function doSaveLF(name, type, itemName, desc, imageUrl, btn, errDiv) {
    var endpoint, body;
    if (name) {
        endpoint = '/api/method/smartspace.frontend_api.member.update_lost_found';
        body = new URLSearchParams({ name: name, report_type: type, item_name: itemName, description: desc, image: imageUrl });
    } else {
        endpoint = '/api/method/smartspace.frontend_api.member.create_lost_found';
        body = new URLSearchParams({ report_type: type, item_name: itemName, description: desc, image: imageUrl });
    }

    fetch(endpoint, {
        method: 'POST',
        headers: { 'X-Frappe-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
    })
    .then(function(r) { return r.json(); })
    .then(function() {
        closeLFModal();
        fetchLF(currentPage);
        btn.disabled = false;
        btn.textContent = name ? 'Update' : 'Submit';
    })
    .catch(function() {
        errDiv.textContent = 'Failed to save. Please try again.';
        errDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = name ? 'Update' : 'Submit';
    });
}

function closeLF(name) {
    if (!confirm('Close this report?')) return;
    fetch('/api/method/smartspace.frontend_api.member.close_lost_found', {
        method: 'POST',
        headers: { 'X-Frappe-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'name=' + encodeURIComponent(name)
    })
    .then(function(r) { return r.json(); })
    .then(function() { fetchLF(currentPage); });
}

function deleteLF(name) {
    if (!confirm('Delete this report?')) return;
    fetch('/api/method/smartspace.frontend_api.member.delete_lost_found', {
        method: 'POST',
        headers: { 'X-Frappe-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'name=' + encodeURIComponent(name)
    })
    .then(function(r) { return r.json(); })
    .then(function() { fetchLF(currentPage); });
}

document.getElementById('searchInput').addEventListener('input', function() { clearTimeout(window._searchTimer); window._searchTimer = setTimeout(function() { fetchLF(1); }, 300); });
document.getElementById('statusFilter').addEventListener('change', function() { fetchLF(1); });
document.getElementById('btnPrev').addEventListener('click', function() { if (currentPage > 1) { fetchLF(currentPage - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
document.getElementById('btnNext').addEventListener('click', function() { if (currentPage < totalPages) { fetchLF(currentPage + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); } });

fetchLF(1);
</script>
</body>
</html>
