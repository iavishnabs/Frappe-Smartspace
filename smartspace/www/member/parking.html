<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Parking | SmartSpace</title>
    <link rel="manifest" href="/assets/smartspace/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/smartspace/favicon.svg">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartSpace">
    <link rel="apple-touch-icon" href="/assets/smartspace/icon-192.svg">
    <script src="/assets/smartspace/js/tailwind.js"></script>
    <script>tailwind.config={theme:{extend:{boxShadow:{card:"0 10px 30px rgba(0,0,0,.08)"}}}}</script>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">
{% set active = 'parking' %}
{% include "www/nav_footer/portal_header.html" %}
{% include "www/member/sidebar.html" %}
<div class="sidebar-content transition-all duration-300">
    <div class="bg-black text-white px-6 py-8">
        <h1 class="text-3xl font-bold">My Parking</h1>
        <p class="text-orange-200 text-sm mt-1">View your active parking allocations</p>
    </div>
    <div class="px-6 py-6">
        <div id="loadingState" class="text-center py-12 text-gray-400">
            <svg class="animate-spin mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            Loading parking details...
        </div>
        <div id="parkingList" class="grid md:grid-cols-2 gap-4" style="display:none"></div>
        <div id="noParking" class="hidden text-center py-20">
            <div class="text-7xl">🅿️</div>
            <h2 class="text-2xl font-bold mt-4">No Active Parking</h2>
            <p class="text-gray-500 mt-2">Your parking allocations will appear here once your reservation is confirmed.</p>
        </div>
    </div>
</div>
<script>
function fmtDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }

fetch('/api/method/smartspace.frontend_api.member.get_my_parking')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var result = data.message || data;
        document.getElementById('loadingState').style.display = 'none';

        if (!result.allocations || result.allocations.length === 0) {
            document.getElementById('noParking').classList.remove('hidden');
            return;
        }

        document.getElementById('parkingList').style.display = '';
        document.getElementById('parkingList').innerHTML = result.allocations.map(function(a) {
            var typeColor = a.allocation_type === 'Visitor' ? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700';
            return '<div class="bg-white rounded-xl shadow-card p-5">' +
                '<div class="flex items-center justify-between mb-3">' +
                    '<div class="flex items-center gap-3">' +
                        '<div class="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center text-2xl">🅿️</div>' +
                        '<div><p class="font-bold">' + (a.slot_name || a.parking_slot || 'N/A') + '</p>' +
                        '<p class="text-xs text-gray-500">' + (a.slot_type || '-') + '</p></div>' +
                    '</div>' +
                    '<span class="px-3 py-1 rounded-full text-xs font-bold ' + typeColor + '">' + (a.allocation_type || 'Member') + '</span>' +
                '</div>' +
                '<div class="space-y-1 text-sm">' +
                    '<div class="flex justify-between"><span class="text-gray-500">Vehicle</span><span class="font-medium">' + (a.vehicle_number || '-') + '</span></div>' +
                    '<div class="flex justify-between"><span class="text-gray-500">Allocated From</span><span class="font-medium">' + fmtDate(a.allocated_from) + '</span></div>' +
                    '<div class="flex justify-between"><span class="text-gray-500">Allocated To</span><span class="font-medium">' + fmtDate(a.allocated_to) + '</span></div>' +
                    '<div class="flex justify-between"><span class="text-gray-500">Status</span><span class="font-medium text-green-600">' + (a.allocation_status || '-') + '</span></div>' +
                '</div>' +
            '</div>';
        }).join('');
    });
</script>
</body>
</html>
