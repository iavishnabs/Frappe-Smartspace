<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | SmartSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-800 flex items-center justify-center min-h-screen">

<div class="text-center px-6">

<div class="text-8xl mb-6">📡</div>

<h1 class="text-4xl font-bold text-gray-800">You're Offline</h1>

<p class="mt-4 text-gray-600 max-w-md mx-auto">
    SmartSpace can't connect to the internet right now.
    Please check your connection and try again.
</p>

<a href="/home"
   class="inline-block mt-8 bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-xl font-semibold transition">
    Try Again
</a>

</div>

</body>
</html>
