<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | SmartSpace</title>

    <link rel="manifest" href="/assets/smartspace/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/smartspace/favicon.svg">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartSpace">
    <link rel="apple-touch-icon" href="/assets/smartspace/icon-192.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        card: "0 10px 30px rgba(0,0,0,.08)"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">
{% include "www/nav_footer/portal_header.html" %}
{% include "www/security/sidebar.html" %}

<div class="sidebar-content transition-all duration-300">
    <!-- Page Header -->
    <div class="bg-black text-white px-6 py-8">
        <h1 class="text-3xl font-bold">Members</h1>
        <p class="text-orange-200 text-sm mt-1">Active members at your location</p>
    </div>

    <div class="px-6 py-6">
        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-card p-4 mb-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1">
                    <input id="searchInput" type="text" placeholder="Search by name..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm">
                </div>
                <select id="typeFilter" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm bg-white">
                    <option value="All Types">All Types</option>
                    <option value="Flex">Flex</option>
                    <option value="Regular">Regular</option>
                </select>
                <button onclick="fetchMembers(1)" class="px-5 py-2.5 rounded-lg bg-orange-500 text-white font-medium text-sm hover:bg-orange-600 transition">Search</button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loadingState" class="text-center py-12 text-gray-400">
            <svg class="animate-spin mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            Loading members...
        </div>

        <!-- Members Table -->
        <div id="membersContainer" style="display:none">
            <div class="bg-white rounded-xl shadow-card overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-gray-50 text-left text-xs text-gray-500 uppercase tracking-wider">
                                <th class="px-4 py-3 font-medium">Name</th>
                                <th class="px-4 py-3 font-medium">Email</th>
                                <th class="px-4 py-3 font-medium">Phone</th>
                                <th class="px-4 py-3 font-medium">Type</th>
                                <th class="px-4 py-3 font-medium">Join Date</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div id="pagination" class="flex items-center justify-between mt-4"></div>
        </div>
    </div>
</div>

<script>
var currentPage = 1;
var totalPages = 1;
var totalMembers = 0;

function formatDate(dateStr) {
    if (!dateStr) return '-';
    var d = new Date(dateStr);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function getInitials(name) {
    if (!name) return '--';
    var parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    return parts[0].substring(0, 2).toUpperCase();
}

function fetchMembers(page) {
    currentPage = page || 1;
    var search = document.getElementById('searchInput').value.trim();
    var memberType = document.getElementById('typeFilter').value;

    var loadingEl = document.getElementById('loadingState');
    var container = document.getElementById('membersContainer');
    loadingEl.classList.remove('hidden');
    container.style.display = 'none';

    var params = 'page=' + currentPage + '&page_size=10';
    if (search) params += '&search=' + encodeURIComponent(search);
    if (memberType && memberType !== 'All Types') params += '&member_type=' + encodeURIComponent(memberType);

    fetch('/api/method/smartspace.frontend_api.security.get_members?' + params)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var result = data.message || data;
            loadingEl.classList.add('hidden');
            container.style.display = '';

            totalMembers = result.total;
            totalPages = result.total_pages;

            var tbody = document.getElementById('membersTableBody');
            if (result.members.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-400">No members found</td></tr>';
            } else {
                tbody.innerHTML = result.members.map(function(m) {
                    var typeColor = m.member_type === 'Flex' ? 'text-blue-500 bg-blue-50' : 'text-purple-500 bg-purple-50';
                    return '<tr class="hover:bg-gray-50 transition">' +
                        '<td class="px-4 py-3">' +
                            '<div class="flex items-center gap-3">' +
                                '<div class="w-9 h-9 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">' + getInitials(m.full_name) + '</div>' +
                                '<span class="font-medium text-gray-800">' + (m.full_name || '-') + '</span>' +
                            '</div>' +
                        '</td>' +
                        '<td class="px-4 py-3 text-gray-600">' + (m.email || '-') + '</td>' +
                        '<td class="px-4 py-3 text-gray-600">' + (m.phone || '-') + '</td>' +
                        '<td class="px-4 py-3"><span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ' + typeColor + '">' + (m.member_type || '-') + '</span></td>' +
                        '<td class="px-4 py-3 text-gray-600">' + formatDate(m.join_date) + '</td>' +
                    '</tr>';
                }).join('');
            }

            renderPagination();
        })
        .catch(function() {
            loadingEl.classList.add('hidden');
            container.style.display = '';
            document.getElementById('membersTableBody').innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-400">Error loading members</td></tr>';
        });
}

function renderPagination() {
    var container = document.getElementById('pagination');
    if (totalPages <= 1) {
        container.innerHTML = '<span class="text-sm text-gray-500">' + totalMembers + ' member(s)</span>';
        return;
    }

    var html = '<span class="text-sm text-gray-500">' + totalMembers + ' member(s)</span>';
    html += '<div class="flex gap-1">';
    if (currentPage > 1) {
        html += '<button onclick="fetchMembers(' + (currentPage - 1) + ')" class="px-3 py-1.5 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">Previous</button>';
    }
    html += '<span class="px-3 py-1.5 text-sm font-medium text-gray-700">Page ' + currentPage + ' of ' + totalPages + '</span>';
    if (currentPage < totalPages) {
        html += '<button onclick="fetchMembers(' + (currentPage + 1) + ')" class="px-3 py-1.5 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">Next</button>';
    }
    html += '</div>';
    container.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') fetchMembers(1);
});

fetchMembers(1);
</script>
</body>
</html>
