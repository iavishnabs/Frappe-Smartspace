<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Slots | SmartSpace</title>

    <link rel="manifest" href="/assets/smartspace/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/smartspace/favicon.svg">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartSpace">
    <link rel="apple-touch-icon" href="/assets/smartspace/icon-192.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        card: "0 10px 30px rgba(0,0,0,.08)"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">
{% include "www/nav_footer/portal_header.html" %}
{% include "www/security/sidebar.html" %}

<div class="sidebar-content transition-all duration-300">
    <!-- Page Header -->
    <div class="bg-black text-white px-6 py-8">
        <h1 class="text-3xl font-bold">Parking Slots</h1>
        <p class="text-orange-200 text-sm mt-1">Manage parking slots at your location</p>
    </div>

    <div class="px-6 py-6">
        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-card p-4 mb-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1">
                    <input id="searchInput" type="text" placeholder="Search by slot name..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm">
                </div>
                <div class="flex-1">
                    <input id="vehicleSearchInput" type="text" placeholder="Search by vehicle number..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm">
                </div>
                <select id="statusFilter" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm bg-white">
                    <option value="All Status">All Status</option>
                    <option value="Available">Available</option>
                    <option value="Occupied">Occupied</option>
                    <option value="Inactive">Inactive</option>
                </select>
                <select id="typeFilter" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm bg-white">
                    <option value="All Types">All Types</option>
                    <option value="Bike">Bike</option>
                    <option value="Car">Car</option>
                    <option value="Visitor">Visitor</option>
                </select>
                <button id="clearFilters" class="px-5 py-2.5 rounded-lg border border-gray-200 text-gray-600 font-medium text-sm hover:bg-gray-50 transition">Clear</button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loadingState" class="text-center py-12 text-gray-400">
            <svg class="animate-spin mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            Loading parking slots...
        </div>

        <!-- Slots Grid -->
        <div id="slotsContainer" style="display:none">
            <div id="slotsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <!-- Pagination -->
            <div id="pagination" class="flex items-center justify-between mt-4"></div>
        </div>
    </div>
</div>

<!-- Confirm Dialog -->
<div id="confirmDialog" class="fixed inset-0 z-[75] hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeConfirmDialog()"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-sm bg-white rounded-xl shadow-xl">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                </div>
                <h3 id="confirmTitle" class="font-bold text-gray-800 text-base">Confirm</h3>
            </div>
            <p id="confirmMessage" class="text-sm text-gray-600 mb-5">Are you sure?</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmDialog()" class="flex-1 py-2.5 rounded-lg border border-gray-200 text-gray-700 font-medium text-sm hover:bg-gray-50 transition">Cancel</button>
                <button id="confirmOkBtn" class="flex-1 py-2.5 rounded-lg bg-orange-500 text-white font-medium text-sm hover:bg-orange-600 transition">OK</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 z-[70] hidden">
    <div id="toastInner" class="px-5 py-3 rounded-lg shadow-lg text-sm font-medium text-white"></div>
</div>

<script>
var currentPage = 1;
var totalPages = 1;
var totalSlots = 0;
var confirmCallback = null;

function showToast(message, type) {
    var toast = document.getElementById('toast');
    var inner = document.getElementById('toastInner');
    inner.textContent = message;
    inner.className = 'px-5 py-3 rounded-lg shadow-lg text-sm font-medium text-white ' + (type === 'error' ? 'bg-red-500' : 'bg-green-500');
    toast.classList.remove('hidden');
    setTimeout(function() { toast.classList.add('hidden'); }, 3000);
}

function showConfirmDialog(title, message, callback) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = message;
    confirmCallback = callback;
    document.getElementById('confirmDialog').classList.remove('hidden');
}

function closeConfirmDialog() {
    document.getElementById('confirmDialog').classList.add('hidden');
    confirmCallback = null;
}

document.getElementById('confirmOkBtn').addEventListener('click', function() {
    if (confirmCallback) confirmCallback();
    closeConfirmDialog();
});

function formatDate(dateStr) {
    if (!dateStr) return '-';
    var d = new Date(dateStr);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function statusColor(status) {
    var colors = {
        'Available': '#10b981',
        'Occupied': '#f59e0b',
        'Inactive': '#6b7280'
    };
    return colors[status] || '#6b7280';
}

function typeIcon(type) {
    if (type === 'Bike') return '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/></svg>';
    if (type === 'Car') return '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>';
}

function fetchSlots(page) {
    currentPage = page || 1;
    var search = document.getElementById('searchInput').value.trim();
    var vehicleSearch = document.getElementById('vehicleSearchInput').value.trim();
    var status = document.getElementById('statusFilter').value;
    var slotType = document.getElementById('typeFilter').value;

    var loadingEl = document.getElementById('loadingState');
    var container = document.getElementById('slotsContainer');
    loadingEl.classList.remove('hidden');
    container.style.display = 'none';

    var params = 'page=' + currentPage + '&page_size=12';
    if (search) params += '&search=' + encodeURIComponent(search);
    if (vehicleSearch) params += '&vehicle_search=' + encodeURIComponent(vehicleSearch);
    if (status && status !== 'All Status') params += '&status=' + encodeURIComponent(status);
    if (slotType && slotType !== 'All Types') params += '&slot_type=' + encodeURIComponent(slotType);

    fetch('/api/method/smartspace.frontend_api.security.get_parking_slots?' + params)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var result = data.message || data;
            loadingEl.classList.add('hidden');
            container.style.display = '';

            totalSlots = result.total;
            totalPages = result.total_pages;

            var grid = document.getElementById('slotsGrid');
            if (result.slots.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400"><p class="font-medium">No parking slots found</p></div>';
            } else {
                grid.innerHTML = result.slots.map(function(s) {
                    var sc = statusColor(s.status);
                    var card = '<div class="bg-white rounded-xl shadow-card p-4 border-l-4" style="border-left-color:#000000">' +
                        '<div class="flex items-start justify-between mb-3">' +
                            '<div class="flex items-center gap-2">' +
                                '<div class="w-9 h-9 rounded-lg bg-gray-100 flex items-center justify-center text-gray-500">' + typeIcon(s.slot_type) + '</div>' +
                                '<div>' +
                                    '<p class="font-bold text-gray-800 text-sm">' + (s.slot_name || s.name) + '</p>' +
                                    '<p class="text-xs text-gray-400">' + (s.slot_type || '-') + ' · ' + (s.floor || '-') + '</p>' +
                                '</div>' +
                            '</div>' +
                            '<span class="text-xs font-medium px-2 py-0.5 rounded" style="background:' + sc + '20;color:' + sc + '">' + s.status + '</span>' +
                        '</div>';

                    if (s.status === 'Occupied' && s.allocation) {
                        var allocType = s.allocation.allocation_type || 'Member';
                        var allocTypeColor = allocType === 'Visitor' ? '#8b5cf6' : '#3b82f6';
                        var occupantName = allocType === 'Visitor' ? (s.allocation.visitor_name || 'Visitor') : (s.member_name || '-');
                        card += '<div class="space-y-1.5 mb-3 text-xs">' +
                            '<div class="flex items-center justify-between"><span class="text-gray-500">Type</span><span class="font-medium px-1.5 py-0.5 rounded" style="background:' + allocTypeColor + '20;color:' + allocTypeColor + '">' + allocType + '</span></div>' +
                            '<div class="flex items-center justify-between"><span class="text-gray-500">' + (allocType === 'Visitor' ? 'Visitor' : 'Member') + '</span><span class="font-medium text-gray-800">' + occupantName + '</span></div>' +
                            '<div class="flex items-center justify-between"><span class="text-gray-500">Vehicle</span><span class="font-medium text-gray-800">' + (s.allocation.vehicle_number || '-') + '</span></div>' +
                            '<div class="flex items-center justify-between"><span class="text-gray-500">Since</span><span class="font-medium text-gray-800">' + formatDate(s.allocation.allocated_from) + '</span></div>' +
                        '</div>' +
                        '<button onclick="releaseSlot(\'' + s.allocation.name + '\', \'' + (s.slot_name || s.name) + '\')" class="w-full py-2 rounded-lg bg-gray-100 text-gray-700 font-medium text-xs hover:bg-gray-200 transition">Release Slot</button>';
                    } else if (s.status === 'Available') {
                        card += '<div class="mb-3"><p class="text-xs text-gray-400">This slot is available.</p></div>';
                    } else {
                        card += '<div class="mb-3"><p class="text-xs text-gray-400">This slot is inactive.</p></div>';
                    }

                    if (s.remarks) {
                        card += '<p class="text-xs text-gray-400 mt-2 italic">' + s.remarks + '</p>';
                    }

                    card += '</div>';
                    return card;
                }).join('');
            }

            renderPagination();
        })
        .catch(function() {
            loadingEl.classList.add('hidden');
            container.style.display = '';
            document.getElementById('slotsGrid').innerHTML = '<div class="col-span-full text-center py-12 text-gray-400"><p class="font-medium">Error loading parking slots</p></div>';
        });
}

function renderPagination() {
    var container = document.getElementById('pagination');
    if (totalPages <= 1) {
        container.innerHTML = '<span class="text-sm text-gray-500">' + totalSlots + ' slot(s)</span>';
        return;
    }

    var html = '<span class="text-sm text-gray-500">' + totalSlots + ' slot(s)</span>';
    html += '<div class="flex gap-1">';
    if (currentPage > 1) {
        html += '<button onclick="fetchSlots(' + (currentPage - 1) + ')" class="px-3 py-1.5 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">Previous</button>';
    }
    html += '<span class="px-3 py-1.5 text-sm font-medium text-gray-700">Page ' + currentPage + ' of ' + totalPages + '</span>';
    if (currentPage < totalPages) {
        html += '<button onclick="fetchSlots(' + (currentPage + 1) + ')" class="px-3 py-1.5 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">Next</button>';
    }
    html += '</div>';
    container.innerHTML = html;
}

function releaseSlot(allocationName, slotDisplayName) {
    showConfirmDialog('Release Parking', 'Release "' + slotDisplayName + '" and free the slot?', function() {
        var body = new FormData();
        body.append('allocation_name', allocationName);

        fetch('/api/method/smartspace.frontend_api.security.release_parking', {
            method: 'POST',
            headers: { 'X-Frappe-CSRF-Token': csrfToken },
            body: body
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var result = data.message || data;
            if (result.success) {
                showToast(result.message, 'success');
                fetchSlots(currentPage);
            } else {
                showToast('Error: ' + (data.exc || 'Release failed'), 'error');
            }
        })
        .catch(function() {
            showToast('Error releasing parking slot', 'error');
        });
    });
}

var debounceTimer;

document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
        fetchSlots(1);
    }, 300);
});

document.getElementById('vehicleSearchInput').addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
        fetchSlots(1);
    }, 300);
});

document.getElementById('statusFilter').addEventListener('change', function() {
    fetchSlots(1);
});

document.getElementById('typeFilter').addEventListener('change', function() {
    fetchSlots(1);
});

document.getElementById('clearFilters').addEventListener('click', function() {
    document.getElementById('searchInput').value = '';
    document.getElementById('vehicleSearchInput').value = '';
    document.getElementById('statusFilter').value = 'All Status';
    document.getElementById('typeFilter').value = 'All Types';
    fetchSlots(1);
});

fetchSlots(1);
</script>
</body>
</html>
