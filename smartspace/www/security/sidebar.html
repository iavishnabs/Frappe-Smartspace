<script>
(function() {
    var sidebar = document.getElementById('desktopSidebar');
    var collapseBtn = document.getElementById('sidebarCollapseBtn');
    var collapseIcon = document.getElementById('collapseIcon');

    function applyCollapsed() {
        sidebar.classList.remove('w-64');
        sidebar.classList.add('w-16');
        collapseIcon.innerHTML = '<polyline points="9 18 15 12 9 6"></polyline>';
        var labels = sidebar.querySelectorAll('.sidebar-label');
        labels.forEach(function(l) { l.style.display = 'none'; });
        var links = sidebar.querySelectorAll('nav a');
        links.forEach(function(a) {
            a.classList.remove('px-4', 'gap-3');
            a.classList.add('px-0', 'justify-center');
        });
        document.documentElement.classList.add('sidebar-collapsed');
    }

    function applyExpanded() {
        sidebar.classList.remove('w-16');
        sidebar.classList.add('w-64');
        collapseIcon.innerHTML = '<polyline points="15 18 9 12 15 6"></polyline>';
        var labels = sidebar.querySelectorAll('.sidebar-label');
        labels.forEach(function(l) { l.style.display = ''; });
        var links = sidebar.querySelectorAll('nav a');
        links.forEach(function(a) {
            a.classList.add('px-4', 'gap-3');
            a.classList.remove('px-0', 'justify-center');
        });
        document.documentElement.classList.remove('sidebar-collapsed');
    }

    function init() {
        var isCollapsed = localStorage.getItem('security_sidebar_collapsed') === 'true';
        if (isCollapsed) { applyCollapsed(); }

        collapseBtn.addEventListener('click', function() {
            isCollapsed = !isCollapsed;
            localStorage.setItem('security_sidebar_collapsed', isCollapsed);
            if (isCollapsed) { applyCollapsed(); } else { applyExpanded(); }
        });

        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('mobileSidebar').classList.remove('hidden');
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
