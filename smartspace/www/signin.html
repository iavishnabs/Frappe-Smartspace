<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpace | Login</title>

    <link rel="manifest" href="/assets/smartspace/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/smartspace/favicon.svg">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartSpace">
    <link rel="apple-touch-icon" href="/assets/smartspace/icon-192.svg">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50">

<div class="min-h-screen flex">

    <!-- Left Side -->
    <div class="hidden lg:flex w-1/2 bg-black items-center justify-center">

        <div class="text-center text-white px-10">

            <div class="w-20 h-20 rounded-2xl bg-orange-500 text-white flex items-center justify-center text-4xl font-bold mx-auto">
                S
            </div>

            <h1 class="text-5xl font-bold mt-8">
                SmartSpace
            </h1>

            <p class="mt-6 text-orange-200 text-lg leading-8 max-w-md">
                Welcome back. Manage workspaces, reservations, members, and
                operations from one centralized dashboard.
            </p>

        </div>

    </div>

    <!-- Right Side -->

    <div class="flex-1 flex items-center justify-center px-6">

        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-10">

            <div class="text-center">

                <h2 id="form-title" class="text-3xl font-bold text-gray-800">
                    Sign In
                </h2>

                <p id="form-subtitle" class="text-gray-500 mt-2">
                    Login to your SmartSpace account
                </p>

            </div>

            <!-- Tab Toggle -->
            <div class="flex bg-gray-100 rounded-xl p-1 mt-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 rounded-lg font-medium text-sm transition bg-white text-orange-600 shadow-sm">
                    Login
                </button>
                <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2 rounded-lg font-medium text-sm transition text-gray-500">
                    Sign Up
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="mt-6 space-y-5">

                <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm">
                </div>

                <div>

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="usr"
                        required
                        placeholder="Enter email"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none">

                </div>

                <div>

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>

                    <div class="relative">
                        <input
                            type="password"
                            id="login-password"
                            name="pwd"
                            required
                            placeholder="Enter password"
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 pr-11 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none">
                        <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>

                </div>

                <button
                    type="submit"
                    id="login-btn"
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white rounded-xl py-3 font-semibold transition">

                    Login

                </button>

            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="mt-6 space-y-5" style="display:none">

                <div id="signup-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm">
                </div>

                <div id="signup-success" class="hidden bg-green-50 border border-green-200 text-green-700 rounded-xl px-4 py-3 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            First Name
                        </label>
                        <input
                            type="text"
                            id="signup-first-name"
                            required
                            placeholder="John"
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Last Name
                        </label>
                        <input
                            type="text"
                            id="signup-last-name"
                            placeholder="Doe"
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        id="signup-email"
                        required
                        placeholder="you@example.com"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="signup-password"
                            required
                            placeholder="Min 6 characters"
                            class="w-full rounded-xl border border-gray-300 px-4 py-3 pr-11 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none">
                        <button type="button" onclick="togglePassword('signup-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Location <span class="text-gray-400 text-xs">(optional)</span>
                    </label>
                    <select id="signup-location" class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none">
                        <option value="">Select location</option>
                    </select>
                </div>

                <button
                    type="submit"
                    id="signup-btn"
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white rounded-xl py-3 font-semibold transition">

                    Create Account

                </button>

            </form>

            <div class="text-center mt-8">

                <a href="/home"
                    class="text-orange-500 hover:underline">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>

<script>
function togglePassword(inputId, btn) {
    var input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    } else {
        input.type = 'password';
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
}

function switchTab(tab) {
    var loginForm = document.getElementById('login-form');
    var signupForm = document.getElementById('signup-form');
    var tabLogin = document.getElementById('tab-login');
    var tabSignup = document.getElementById('tab-signup');
    var title = document.getElementById('form-title');
    var subtitle = document.getElementById('form-subtitle');

    if (tab === 'login') {
        loginForm.style.display = '';
        signupForm.style.display = 'none';
        tabLogin.className = 'flex-1 py-2 rounded-lg font-medium text-sm transition bg-white text-orange-600 shadow-sm';
        tabSignup.className = 'flex-1 py-2 rounded-lg font-medium text-sm transition text-gray-500';
        title.textContent = 'Sign In';
        subtitle.textContent = 'Login to your SmartSpace account';
    } else {
        loginForm.style.display = 'none';
        signupForm.style.display = '';
        tabLogin.className = 'flex-1 py-2 rounded-lg font-medium text-sm transition text-gray-500';
        tabSignup.className = 'flex-1 py-2 rounded-lg font-medium text-sm transition bg-white text-orange-600 shadow-sm';
        title.textContent = 'Sign Up';
        subtitle.textContent = 'Create your SmartSpace account';
    }
}

// Load locations for signup form
fetch('/api/method/smartspace.frontend_api.guest.get_locations')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var locations = data.message || data;
        var select = document.getElementById('signup-location');
        if (locations && locations.length) {
            locations.forEach(function(loc) {
                var opt = document.createElement('option');
                opt.value = loc.name;
                opt.textContent = loc.location_name || loc.name;
                select.appendChild(opt);
            });
        }
    });

// Login form handler
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();

    var btn = document.getElementById('login-btn');
    var errorDiv = document.getElementById('login-error');
    var email = document.getElementById('login-email').value;
    var password = document.getElementById('login-password').value;

    errorDiv.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    fetch('/api/method/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'usr=' + encodeURIComponent(email) + '&pwd=' + encodeURIComponent(password)
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (data.message === 'Logged In') {
            return fetch('/api/method/smartspace.frontend_api.auth.get_current_user')
                .then(function(r) { return r.json(); })
                .then(function(user) {
                    if (user && user.message && user.message.redirect_url) {
                        window.location.href = user.message.redirect_url;
                    } else {
                        window.location.href = '/home';
                    }
                });
        } else {
            throw new Error(data.message || 'Login failed');
        }
    })
    .catch(function(err) {
        errorDiv.textContent = 'Invalid email or password. Please try again.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Login';
    });
});

// Signup form handler
document.getElementById('signup-form').addEventListener('submit', function(e) {
    e.preventDefault();

    var btn = document.getElementById('signup-btn');
    var errorDiv = document.getElementById('signup-error');
    var successDiv = document.getElementById('signup-success');
    var firstName = document.getElementById('signup-first-name').value.trim();
    var lastName = document.getElementById('signup-last-name').value.trim();
    var email = document.getElementById('signup-email').value.trim();
    var password = document.getElementById('signup-password').value;
    var location = document.getElementById('signup-location').value;

    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Creating account...';

    var body = new URLSearchParams({
        first_name: firstName,
        last_name: lastName,
        email: email,
        password: password
    });
    if (location) body.set('location', location);

    fetch('/api/method/smartspace.frontend_api.auth.signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        var result = data.message || data;
        if (result.success) {
            successDiv.innerHTML = '<strong>Account created!</strong> Redirecting to login...';
            successDiv.classList.remove('hidden');

            // Pre-fill login form and switch to login tab
            document.getElementById('login-email').value = email;
            setTimeout(function() {
                switchTab('login');
                document.getElementById('login-password').focus();
            }, 1500);
        } else {
            throw new Error(result.message || 'Signup failed');
        }
        btn.disabled = false;
        btn.textContent = 'Create Account';
    })
    .catch(function(err) {
        var msg = 'Failed to create account. Please try again.';
        try {
            var parsed = JSON.parse(err.message);
            if (parsed && parsed.message) msg = parsed.message;
        } catch(e2) {
            if (err.message && err.message.length < 200) msg = err.message;
        }
        errorDiv.textContent = msg;
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create Account';
    });
});

// Auto-switch to signup tab if redirect URL contains ?signup=1
var urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('signup') === '1') {
    switchTab('signup');
}
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/assets/smartspace/sw.js');
    });
}
</script>

</body>
</html>
