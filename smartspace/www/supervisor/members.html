<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | SmartSpace</title>

    <link rel="manifest" href="/assets/smartspace/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/smartspace/favicon.svg">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartSpace">
    <link rel="apple-touch-icon" href="/assets/smartspace/icon-192.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        card: "0 10px 30px rgba(0,0,0,.08)"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">
{% include "www/nav_footer/portal_header.html" %}
{% include "www/supervisor/sidebar.html" %}

<div class="sidebar-content transition-all duration-300">
    <!-- Page Header -->
    <div class="bg-black text-white px-6 py-8">
        <h1 class="text-3xl font-bold">Members</h1>
        <p class="text-orange-200 text-sm mt-1">View all active members</p>
    </div>

    <!-- Filters Bar -->
    <div class="bg-white shadow-sm border-b px-6 py-4 sticky top-20 z-30">
        <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
            <!-- Search -->
            <div class="relative flex-1 sm:max-w-xs">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input id="searchInput" type="text" placeholder="Search by name..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm bg-white">
            </div>
            <!-- Member Type Filter -->
            <select id="memberTypeFilter" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm bg-white">
                <option value="All Types">All Types</option>
                <option value="Flex">Flex</option>
                <option value="Regular">Regular</option>
            </select>
            <!-- Clear Filters -->
            <button id="clearFilters" class="px-4 py-2.5 rounded-lg border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition">Clear</button>
            <!-- Per Page -->
            <select id="pageSizeSelect" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 outline-none text-sm bg-white sm:ml-auto">
                <option value="10">10 / page</option>
                <option value="20">20 / page</option>
                <option value="50">50 / page</option>
            </select>
        </div>
    </div>

    <!-- Members List -->
    <div class="px-6 py-6">
        <div id="loadingState" class="text-center py-12 text-gray-400">
            <svg class="animate-spin mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            Loading members...
        </div>

        <div id="emptyState" class="hidden text-center py-16">
            <svg class="mx-auto mb-4 text-gray-300" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <p class="text-gray-500 font-medium">No members found</p>
            <p class="text-gray-400 text-sm mt-1">Try adjusting your search or filters</p>
        </div>

        <!-- Desktop Table -->
        <div id="tableContainer" class="bg-white rounded-xl shadow-card overflow-hidden" style="display:none">
            <table class="w-full">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Email</th>
                        <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Phone</th>
                        <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Type</th>
                        <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Location</th>
                        <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Join Date</th>
                        <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Expiry</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>

        <!-- Mobile Cards -->
        <div id="cardContainer" class="space-y-3" style="display:none"></div>

        <!-- Pagination -->
        <div id="paginationBar" class="hidden mt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div id="paginationInfo" class="text-sm text-gray-500"></div>
            <div id="paginationControls" class="flex items-center gap-2"></div>
        </div>
    </div>
</div>

<script>
var currentPage = 1;
var currentPageSize = 10;
var currentSearch = '';
var currentMemberType = 'All Types';
var debounceTimer;

function fetchMembers() {
    var loadingState = document.getElementById('loadingState');
    var tableContainer = document.getElementById('tableContainer');
    var cardContainer = document.getElementById('cardContainer');
    var emptyState = document.getElementById('emptyState');
    var paginationBar = document.getElementById('paginationBar');

    loadingState.classList.remove('hidden');
    tableContainer.style.display = 'none';
    cardContainer.style.display = 'none';
    emptyState.classList.add('hidden');
    paginationBar.classList.add('hidden');

    var params = new URLSearchParams({
        search: currentSearch,
        member_type: currentMemberType,
        page: currentPage,
        page_size: currentPageSize
    });

    fetch('/api/method/smartspace.frontend_api.supervisor.get_members?' + params.toString())
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var result = data.message || data;
            loadingState.classList.add('hidden');

            if (result.members.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            renderTable(result.members);
            renderCards(result.members);
            renderPagination(result);
            paginationBar.classList.remove('hidden');
        })
        .catch(function() {
            loadingState.classList.add('hidden');
            emptyState.classList.remove('hidden');
        });
}

function getInitials(name) {
    if (!name) return '?';
    var parts = name.trim().split(' ');
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return name.substring(0, 2).toUpperCase();
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    var d = new Date(dateStr);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function memberTypeBadge(type) {
    var colors = {
        'Flex': 'bg-purple-50 text-purple-600',
        'Regular': 'bg-blue-50 text-blue-600'
    };
    var cls = colors[type] || 'bg-gray-50 text-gray-600';
    return '<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ' + cls + '">' + (type || '-') + '</span>';
}

function renderTable(members) {
    var tbody = document.getElementById('tableBody');
    tbody.innerHTML = members.map(function(m) {
        return '<tr class="hover:bg-gray-50 transition">' +
            '<td class="px-6 py-4">' +
                '<div class="flex items-center gap-3">' +
                    '<div class="w-9 h-9 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-xs">' + getInitials(m.full_name) + '</div>' +
                    '<span class="font-medium text-gray-800">' + (m.full_name || 'N/A') + '</span>' +
                '</div>' +
            '</td>' +
            '<td class="px-6 py-4 text-sm text-gray-600">' + (m.email || '-') + '</td>' +
            '<td class="px-6 py-4 text-sm text-gray-600">' + (m.phone || '-') + '</td>' +
            '<td class="px-6 py-4">' + memberTypeBadge(m.member_type) + '</td>' +
            '<td class="px-6 py-4 text-sm text-gray-600">' + (m.location || '-') + '</td>' +
            '<td class="px-6 py-4 text-sm text-gray-600">' + formatDate(m.join_date) + '</td>' +
            '<td class="px-6 py-4 text-sm text-gray-600">' + formatDate(m.expiry_date) + '</td>' +
        '</tr>';
    }).join('');
    document.getElementById('tableContainer').style.display = window.innerWidth >= 768 ? 'block' : 'none';
}

function renderCards(members) {
    var container = document.getElementById('cardContainer');
    container.innerHTML = members.map(function(m) {
        return '<div class="bg-white rounded-xl shadow-card p-4">' +
            '<div class="flex items-center gap-3 mb-3">' +
                '<div class="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-sm">' + getInitials(m.full_name) + '</div>' +
                '<div class="flex-1">' +
                    '<div class="font-medium text-gray-800">' + (m.full_name || 'N/A') + '</div>' +
                    '<div class="text-xs text-gray-500">' + (m.email || '-') + '</div>' +
                '</div>' +
                memberTypeBadge(m.member_type) +
            '</div>' +
            '<div class="grid grid-cols-2 gap-2 text-sm">' +
                '<div><span class="text-gray-400">Phone:</span> <span class="text-gray-700">' + (m.phone || '-') + '</span></div>' +
                '<div><span class="text-gray-400">Location:</span> <span class="text-gray-700">' + (m.location || '-') + '</span></div>' +
                '<div><span class="text-gray-400">Join:</span> <span class="text-gray-700">' + formatDate(m.join_date) + '</span></div>' +
                '<div><span class="text-gray-400">Expiry:</span> <span class="text-gray-700">' + formatDate(m.expiry_date) + '</span></div>' +
            '</div>' +
        '</div>';
    }).join('');
    cardContainer.style.display = window.innerWidth < 768 ? 'block' : 'none';
}

function renderPagination(data) {
    var info = document.getElementById('paginationInfo');
    var controls = document.getElementById('paginationControls');
    var start = (data.page - 1) * data.page_size + 1;
    var end = Math.min(data.page * data.page_size, data.total);
    info.textContent = 'Showing ' + start + '-' + end + ' of ' + data.total + ' members';

    var html = '';
    html += '<button onclick="goToPage(' + (data.page - 1) + ')" ' + (data.page <= 1 ? 'disabled' : '') + ' class="px-3 py-2 rounded-lg border text-sm font-medium transition ' + (data.page <= 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-700 hover:bg-gray-50 border-gray-200') + '">Prev</button>';

    var maxVisible = 5;
    var startPage = Math.max(1, data.page - Math.floor(maxVisible / 2));
    var endPage = Math.min(data.total_pages, startPage + maxVisible - 1);
    if (endPage - startPage < maxVisible - 1) { startPage = Math.max(1, endPage - maxVisible + 1); }

    if (startPage > 1) {
        html += '<button onclick="goToPage(1)" class="px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">1</button>';
        if (startPage > 2) { html += '<span class="px-1 text-gray-400">...</span>'; }
    }

    for (var i = startPage; i <= endPage; i++) {
        html += '<button onclick="goToPage(' + i + ')" class="px-3 py-2 rounded-lg border text-sm font-medium transition ' + (i === data.page ? 'bg-orange-500 text-white border-orange-500' : 'text-gray-700 hover:bg-gray-50 border-gray-200') + '">' + i + '</button>';
    }

    if (endPage < data.total_pages) {
        if (endPage < data.total_pages - 1) { html += '<span class="px-1 text-gray-400">...</span>'; }
        html += '<button onclick="goToPage(' + data.total_pages + ')" class="px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">' + data.total_pages + '</button>';
    }

    html += '<button onclick="goToPage(' + (data.page + 1) + ')" ' + (data.page >= data.total_pages ? 'disabled' : '') + ' class="px-3 py-2 rounded-lg border text-sm font-medium transition ' + (data.page >= data.total_pages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-700 hover:bg-gray-50 border-gray-200') + '">Next</button>';

    controls.innerHTML = html;
}

function goToPage(page) {
    if (page < 1) return;
    currentPage = page;
    fetchMembers();
}

document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
        currentSearch = document.getElementById('searchInput').value.trim();
        currentPage = 1;
        fetchMembers();
    }, 300);
});

document.getElementById('memberTypeFilter').addEventListener('change', function() {
    currentMemberType = this.value;
    currentPage = 1;
    fetchMembers();
});

document.getElementById('clearFilters').addEventListener('click', function() {
    currentSearch = '';
    currentMemberType = 'All Types';
    currentPage = 1;
    document.getElementById('searchInput').value = '';
    document.getElementById('memberTypeFilter').value = 'All Types';
    fetchMembers();
});

document.getElementById('pageSizeSelect').addEventListener('change', function() {
    currentPageSize = parseInt(this.value);
    currentPage = 1;
    fetchMembers();
});

fetchMembers();

window.addEventListener('resize', function() {
    var table = document.getElementById('tableContainer');
    var cards = document.getElementById('cardContainer');
    if (table.style.display !== 'none' || cards.style.display !== 'none') {
        table.style.display = window.innerWidth >= 768 ? 'block' : 'none';
        cards.style.display = window.innerWidth < 768 ? 'block' : 'none';
    }
});
</script>
</body>
</html>
